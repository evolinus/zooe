# seminars offered to schools
seminars:
  - level: Scuola primaria
    title: Vestiti da vespa
    text: Perché gli insetti si travestono da foglie, e la vespa si veste di giallo e nero? Grandi storie di piccoli animali, da fare e da ascoltare.
  - level: Secondaria di I grado
    title: Dall'Alga alla Zebra
    text: Come si origina la biodiversità? Adattamenti sorprendenti, forme mirabolanti ed estinzioni inaspettate, lette alla luce dell'evoluzione.
  - level: Secondaria di II grado
    title: Mutazioni ed evoluzione
    text: Cosa sono le mutazioni, perché avvengono e che fine fanno? Alle origini della biodiversità, con la matita in mano.
