# site properties and page defaults
title: the zoo_e lab
description: Zoology and Evolution @ unipv.it
# logo-text: false
footer: images/backgrounds/background.blu.png

proofer: false

# site social media and other links
links:
  email: lino.ometto@unipv.it
  orcid: 0000-0002-2679-625X
  google-scholar: RVjMHWgAAAAJ
  github: evolinus
  # twitter: evolinus
  # youtube: evolinus

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # keep the search console verification file out of the generated sitemap
  - scope:
      path: "google5268eb9fa20642e4.html"
    values:
      sitemap: false
  # Both laboratory apps are public and linked from the teaching page, so they
  # belong in the sitemap and are left to jekyll-sitemap, which lists static
  # .html files as well as pages. The two redirect stubs that hold their former
  # addresses open carry sitemap: false in their own front matter instead, so
  # only the real page of each app is advertised.

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - CLAUDE.md

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
